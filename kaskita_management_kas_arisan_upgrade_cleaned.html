<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #a5a6ff;outline-offset:2px}button:disabled{opacity:.55;cursor:not-allowed}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:248px;background:#fff;border-right:1px solid var(--line);padding:25px 16px;display:flex;flex-direction:column;z-index:10}.brand{display:flex;align-items:center;gap:12px;padding:0 10px 28px}.brand-mark{width:44px;height:44px;background:var(--primary);color:white;border-radius:14px;display:grid;place-items:center;font-size:22px;font-weight:800}.brand strong{display:block;font-size:18px;letter-spacing:-.5px}.brand small{color:var(--muted);font-size:11px}.nav-label{font-size:11px;font-weight:700;letter-spacing:1px;color:#98a2b3;padding:0 12px 10px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;color:#667085;padding:12px 13px;border-radius:11px;display:flex;gap:12px;align-items:center;font-weight:600;font-size:14px}.nav button .ico{width:22px;text-align:center;font-size:18px}.nav button:hover{background:#f7f7fc}.nav button.active{background:var(--soft);color:var(--primary)}.side-bottom{margin-top:auto;background:#f7f7ff;border:1px solid #e9e9ff;padding:14px;border-radius:14px}.side-bottom b{font-size:13px}.side-bottom p{font-size:12px;color:var(--muted);line-height:1.5;margin:7px 0 0}.main{margin-left:248px;min-height:100vh}.topbar{height:78px;background:#ffffffd9;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:5}.top-title{font-size:13px;color:var(--muted)}.top-title strong{display:block;color:var(--ink);font-size:18px;margin-top:4px}.top-actions{display:flex;align-items:center;gap:10px}.class-pill{background:#f0f0ff;color:#4243b8;padding:9px 12px;border-radius:10px;font-size:12px;font-weight:700}.avatar{width:38px;height:38px;border-radius:12px;background:#e8e8ff;color:#4e4fc7;display:grid;place-items:center;font-weight:800}.content{max-width:1440px;margin:auto;padding:30px 34px 60px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:24px}.page-head h1{font-size:27px;letter-spacing:-.8px;margin:0 0 7px}.page-head p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}.btn{border:1px solid transparent;border-radius:10px;padding:11px 15px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s}.btn-primary{background:var(--primary);color:white}.btn-primary:hover{background:var(--primary-dark)}.btn-soft{background:var(--soft);color:#4243b8}.btn-outline{background:white;border-color:var(--line);color:var(--ink)}.btn-danger{background:var(--red-bg);color:var(--red)}.btn-sm{padding:8px 11px;font-size:12px}.stats{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:16px;margin-bottom:20px}.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.stat{padding:21px}.stat.primary-stat{background:linear-gradient(135deg,#5556dc,#7475ed);color:white;border:0;position:relative;overflow:hidden}.stat.primary-stat:after{content:"";position:absolute;width:170px;height:170px;border:30px solid #ffffff12;border-radius:50%;right:-48px;top:-75px}.stat-label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}.primary-stat .stat-label{color:#e0e0ff}.stat-value{font-size:29px;font-weight:800;letter-spacing:-1px;margin:14px 0 8px;overflow-wrap:anywhere}.stat-foot{font-size:12px;color:var(--muted)}.primary-stat .stat-foot{color:#e0e0ff}.stat-icon{width:35px;height:35px;border-radius:11px;display:grid;place-items:center;background:#f1f2f8;color:#667085;font-size:17px}.stat-line{display:flex;align-items:center;justify-content:space-between}.grid-main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(270px,1fr);gap:18px}.panel{padding:21px;margin-bottom:18px;min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}.panel-head h2{margin:0;font-size:16px;letter-spacing:-.3px}.muted{color:var(--muted)}.small{font-size:12px}.progress{height:8px;background:#eceef5;border-radius:30px;overflow:hidden}.progress span{display:block;height:100%;background:var(--primary);border-radius:30px}.progress-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin:14px 0 10px}.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick{border:1px solid var(--line);border-radius:13px;padding:15px;text-align:left;background:#fff;color:var(--ink);font-weight:700}.quick:hover{border-color:#c7c8ff;background:#fafaff}.quick .quick-ico{display:grid;place-items:center;width:37px;height:37px;border-radius:11px;background:var(--soft);color:var(--primary);font-size:19px;margin-bottom:13px}.quick small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:5px}.activity{display:grid;gap:0}.activity-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #f0f1f5}.activity-item:last-child{border-bottom:0}.activity-icon{width:39px;height:39px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}.activity-icon.in{background:var(--green-bg);color:var(--green)}.activity-icon.out{background:var(--red-bg);color:var(--red)}.activity-text{min-width:0;flex:1}.activity-text b{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.activity-text small{font-size:11px;color:var(--muted);display:block;margin-top:5px}.amount{font-weight:700;font-size:13px;white-space:nowrap}.amount.in{color:var(--green)}.amount.out{color:var(--red)}.table-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.field{display:grid;gap:7px;min-width:0;flex:1}.field label{font-size:12px;font-weight:700;color:#475467}.field input,.field select,.field textarea,.search{width:100%;border:1px solid #d9deea;border-radius:10px;padding:12px;background:white;color:var(--ink);min-width:0}.field input::placeholder,.search::placeholder{color:#98a2b3}.field .error{font-size:12px;color:var(--red)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.form-grid .full{grid-column:1/-1}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:#8a94a6;font-weight:700;padding:12px 13px;background:#fafbfe;border-bottom:1px solid var(--line)}td{padding:14px 13px;border-bottom:1px solid #eef0f5;font-size:13px}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fcfcff}.person{display:flex;align-items:center;gap:10px}.person-avatar{width:34px;height:34px;border-radius:11px;background:#efefff;color:#5556c9;display:grid;place-items:center;font-size:12px;font-weight:800}.person b{font-size:13px}.person small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:30px;padding:6px 9px;font-size:11px;font-weight:700}.badge.ok{background:var(--green-bg);color:var(--green)}.badge.wait{background:var(--amber-bg);color:var(--amber)}.badge.info{background:#edf5ff;color:var(--blue)}.badge.bad{background:var(--red-bg);color:var(--red)}.empty{padding:45px 20px;text-align:center}.empty-ico{width:58px;height:58px;background:var(--soft);color:var(--primary);border-radius:18px;display:grid;place-items:center;font-size:25px;margin:0 auto 14px}.empty h3{margin:0 0 7px;font-size:16px}.empty p{margin:0 auto 17px;color:var(--muted);font-size:13px;max-width:340px;line-height:1.6}.section-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.section-grid .panel{margin-bottom:0}.filter{max-width:220px}.modal-backdrop{position:fixed;inset:0;background:#18223066;z-index:30;display:grid;place-items:center;padding:20px}.modal{width:min(540px,100%);max-height:90vh;overflow:auto;background:white;border-radius:20px;padding:25px;box-shadow:0 20px 70px #11182733}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.modal-head h2{margin:0;font-size:20px}.close{border:0;background:#f2f3f7;border-radius:9px;width:35px;height:35px;font-size:20px}.toast{position:fixed;right:24px;bottom:24px;z-index:50;background:#182230;color:white;padding:14px 18px;border-radius:12px;box-shadow:0 8px 30px #0002;font-size:13px;max-width:calc(100vw - 32px)}.toast.error{background:#9f2934}.mobile-brand,.mobile-nav{display:none}.hint{font-size:12px;color:var(--muted);line-height:1.6}.pill{background:#f0f0ff;color:#4b4cc0;border-radius:8px;padding:6px 9px;font-size:11px;font-weight:700}.search{max-width:300px}.modal-backdrop[hidden],.toast[hidden]{display:none!important}
@media(max-width:1050px){.sidebar{width:215px}.main{margin-left:215px}.content{padding:25px 22px}.topbar{padding:0 22px}.stats{grid-template-columns:1fr 1fr}.primary-stat{grid-column:1/-1}.grid-main{grid-template-columns:1fr}.section-grid{grid-template-columns:1fr}}
@media(max-width:680px){.sidebar{display:none}.main{margin:0;padding-bottom:75px}.topbar{height:66px;padding:0 17px}.top-title strong{font-size:16px}.class-pill{display:none}.content{padding:22px 15px 35px}.page-head{align-items:center;margin-bottom:18px}.page-head h1{font-size:23px}.page-head p{font-size:12px}.page-head .btn{padding:10px 11px;font-size:12px}.stats{grid-template-columns:1fr 1fr;gap:10px}.primary-stat{grid-column:1/-1}.stat{padding:16px}.stat-value{font-size:23px;margin:10px 0 7px}.stat-label{font-size:11px}.panel{padding:16px;margin-bottom:13px}.grid-main{gap:0}.panel-head h2{font-size:15px}.mobile-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:15;display:grid;grid-template-columns:repeat(5,1fr);padding:7px 4px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px #1b24400a}.mobile-nav button{border:0;background:transparent;color:#8992a3;display:grid;gap:4px;justify-items:center;font-size:10px;padding:5px 0}.mobile-nav button span:first-child{font-size:19px}.mobile-nav button.active{color:var(--primary);font-weight:800}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.form-actions{flex-direction:column-reverse}.form-actions .btn{width:100%}.table-tools>*{max-width:none;width:100%}.search{max-width:none}.quick-grid{gap:8px}.quick{padding:12px}.quick .quick-ico{margin-bottom:9px}.modal-backdrop{align-items:end;padding:0}.modal{border-radius:20px 20px 0 0;width:100%;max-height:92vh;padding:22px 18px calc(24px + env(safe-area-inset-bottom))}.toast{bottom:88px;right:16px}.hide-mobile{display:none!important}}
@media(min-width:681px) and (max-width:900px){.mobile-nav{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brand-mark">K</div><div><strong>KasKita</strong><small>Kas & Arisan Kelas</small></div></div>
  <div class="nav-label">MENU UTAMA</div>
  <nav class="nav" id="sideNav" aria-label="Navigasi utama">
    <button class="active" data-page="dashboard"><span class="ico">⌂</span>Dashboard</button>
    <button data-page="anggota"><span class="ico">♙</span>Anggota</button>
    <button data-page="kas"><span class="ico">↕</span>Uang Kas</button>
    <button data-page="arisan"><span class="ico">◉</span>Arisan</button>
    <button data-page="laporan"><span class="ico">▤</span>Laporan</button>
  </nav>
  <div class="side-bottom"><b>✦ Kas kelas lebih rapi</b><p>Catat transaksi, pantau iuran, dan jaga laporan tetap transparan.</p></div>
</aside>
<div class="main">
  <header class="topbar"><div class="top-title">Ruang kelas<strong id="topClass">KasKita / Kelas</strong></div><div class="top-actions"><span class="class-pill">✦ Pengelolaan Kelas</span><div class="avatar" aria-label="Admin">A</div></div></header>
  <main class="content" id="mainContent"></main>
</div>
<nav class="mobile-nav" id="mobileNav" aria-label="Navigasi mobile">
  <button class="active" data-page="dashboard"><span>⌂</span>Beranda</button><button data-page="anggota"><span>♙</span>Anggota</button><button data-page="kas"><span>↕</span>Kas</button><button data-page="arisan"><span>◉</span>Arisan</button><button data-page="laporan"><span>▤</span>Laporan</button>
</nav>
<div id="modalRoot"></div><div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>
<script>
const $=id=>document.getElementById(id), uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
const dateNow=()=>new Date().toLocaleDateString('en-CA');
const dateFmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'—';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const init={className:'Kelas 19.1B.24',members:[],cash:[],rounds:[],payments:[],winners:[],opening:0};
let data;try{data=JSON.parse(localStorage.getItem('kaskita-v2'))||init}catch{data=init}
for(const k of Object.keys(init))if(data[k]===undefined)data[k]=init[k];
let page='dashboard',toastTimer;
function persist(){try{localStorage.setItem('kaskita-v2',JSON.stringify(data));return true}catch(e){notify('Penyimpanan gagal. Periksa ruang penyimpanan browser.','error');return false}}
function notify(msg,type=''){const t=$('toast');t.textContent=msg;t.className='toast '+type;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,3200)}
function setPage(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>{const on=b.dataset.page===p;b.classList.toggle('active',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});render()}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
function sum(type){return data.cash.filter(x=>x.type===type).reduce((s,x)=>s+Number(x.amount),0)}
function balance(){return Number(data.opening||0)+sum('in')-sum('out')}
function member(id){return data.members.find(m=>m.id===id)}
function round(id){return data.rounds.find(r=>r.id===id)}
function personName(id){return member(id)?.name||'Anggota dihapus'}
function badge(text,type='info'){return `<span class="badge ${type}">${esc(text)}</span>`}
function pageHead(title,sub,action=''){return `<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
function empty(icon,title,desc,button=''){return `<div class="empty"><div class="empty-ico">${icon}</div><h3>${title}</h3><p>${desc}</p>${button}</div>`}
function statsCard(label,value,ico,foot='',kind=''){return `<div class="card stat ${kind}"><div class="stat-line"><span class="stat-label">${label}</span><span class="stat-icon">${ico}</span></div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div></div>`}
function table(headers,rows,emptyText='Belum ada data.'){return rows.length?`<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:empty('▤',emptyText,'Data akan muncul di sini setelah kamu menambahkan catatan.')}
function activity(items){return items.length?`<div class="activity">${items.map(x=>`<div class="activity-item"><div class="activity-icon ${x.type==='in'?'in':'out'}">${x.type==='in'?'↙':'↗'}</div><div class="activity-text"><b>${esc(x.desc)}</b><small>${dateFmt(x.date)} · ${x.type==='in'?'Pemasukan':'Pengeluaran'}</small></div><div class="amount ${x.type}">${x.type==='in'?'+':'−'}${money(x.amount)}</div></div>`).join('')}</div>`:empty('↕','Belum ada transaksi','Transaksi yang kamu catat akan muncul di sini.',`<button class="btn btn-primary" onclick="openCash()">+ Catat transaksi</button>`)}
function dashboard(){const paid=data.members.filter(m=>data.cash.some(c=>c.memberId===m.id&&c.type==='in'&&c.category==='iuran')).length;const latest=[...data.cash].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);return `${pageHead('Dashboard','Pantau kondisi kas dan aktivitas kelasmu.',`<button class="btn btn-primary" onclick="openCash()">＋ Catat transaksi</button>`)}
<div class="stats">${statsCard('Saldo kas',money(balance()),'◈','Saldo awal + pemasukan − pengeluaran','primary-stat')}${statsCard('Total pemasukan',money(sum('in')),'↙','Semua pemasukan tercatat')}${statsCard('Total pengeluaran',money(sum('out')),'↗','Semua pengeluaran tercatat')}</div>
<div class="grid-main"><div><section class="panel"><div class="panel-head"><h2>Transaksi terbaru</h2><button class="btn btn-soft btn-sm" onclick="setPage('kas')">Lihat semua →</button></div>${activity(latest)}</section>
<section class="panel"><div class="panel-head"><h2>Ringkasan anggota</h2><button class="btn btn-soft btn-sm" onclick="setPage('anggota')">Kelola →</button></div><div class="stat-line"><div><div class="stat-value" style="font-size:25px;margin:0">${data.members.length}</div><div class="stat-foot">Total anggota kelas</div></div><div class="pill">Anggota terdaftar</div></div></section></div>
<div><section class="panel"><div class="panel-head"><h2>Aksi cepat</h2></div><div class="quick-grid"><button class="quick" onclick="openMember()"><span class="quick-ico">＋</span>Tambah anggota<small>Daftarkan anggota kelas</small></button><button class="quick" onclick="openCash()"><span class="quick-ico">↕</span>Catat kas<small>Tambah pemasukan / biaya</small></button><button class="quick" onclick="openRound()"><span class="quick-ico">◉</span>Buat arisan<small>Mulai putaran baru</small></button><button class="quick" onclick="setPage('laporan')"><span class="quick-ico">▤</span>Lihat laporan<small>Ringkasan dan ekspor</small></button></div></section>
<section class="panel"><div class="panel-head"><h2>Arisan berjalan</h2><button class="btn btn-soft btn-sm" onclick="setPage('arisan')">Lihat →</button></div>${data.rounds.length?data.rounds.slice().sort((a,b)=>b.number-a.number).slice(0,3).map(r=>{const count=data.payments.filter(p=>p.roundId===r.id).length;return `<div class="activity-item"><div class="activity-icon" style="background:#f0f0ff;color:#5b5ce2">◉</div><div class="activity-text"><b>Putaran ${r.number}</b><small>${count}/${data.members.length} anggota bayar</small></div><b class="amount">${money(r.amount)}</b></div>`}).join(''):empty('◉','Belum ada arisan','Buat putaran untuk mulai mencatat iuran.')}</section></div></div>`}
function memberRows(){return data.members.map((m,i)=>`<tr><td>${i+1}</td><td><div class="person"><div class="person-avatar">${esc(m.name.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase())}</div><div><b>${esc(m.name)}</b><small>${m.absen?'Absen '+esc(m.absen):'Anggota kelas'}</small></div></div></td><td>${esc(m.absen||'—')}</td><td>${badge('Aktif','ok')}</td><td><button class="btn btn-outline btn-sm" onclick="openMember('${m.id}')">Edit</button> <button class="btn btn-danger btn-sm" onclick="removeMember('${m.id}')">Hapus</button></td></tr>`)}
function membersPage(){return `${pageHead('Anggota',`Kelola ${data.members.length} anggota yang terdaftar di kelas.`,`<button class="btn btn-primary" onclick="openMember()">＋ Tambah anggota</button>`)}<section class="panel"><div class="table-tools"><input class="search" id="memberSearch" placeholder="⌕  Cari nama atau nomor absen..." aria-label="Cari anggota"><span class="pill">${data.members.length} anggota</span></div><div id="memberRows">${table(['No.','Nama anggota','Absen','Status','Aksi'],memberRows(),'Belum ada anggota')}</div></section>`}
function cashRows(){return [...data.cash].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr><td>${dateFmt(x.date)}</td><td><b>${esc(x.desc)}</b>${x.category?`<small class="muted" style="display:block;margin-top:4px">${esc(x.category)}</small>`:''}</td><td>${x.type==='in'?badge('Pemasukan','ok'):badge('Pengeluaran','bad')}</td><td class="amount ${x.type}">${x.type==='in'?'+':'−'}${money(x.amount)}</td><td><button class="btn btn-danger btn-sm" onclick="removeCash('${x.id}')">Hapus</button></td></tr>`)}
function cashPage(){return `${pageHead('Uang Kas','Catat dan pantau semua pemasukan serta pengeluaran.',`<button class="btn btn-primary" onclick="openCash()">＋ Catat transaksi</button>`)}<div class="stats">${statsCard('Saldo saat ini',money(balance()),'◈','','')}${statsCard('Pemasukan',money(sum('in')),'↙','','')}${statsCard('Pengeluaran',money(sum('out')),'↗','','')}</div><section class="panel"><div class="panel-head"><h2>Riwayat transaksi</h2><span class="pill">${data.cash.length} catatan</span></div><div class="table-tools"><input class="search" id="cashSearch" placeholder="⌕  Cari keterangan transaksi..." aria-label="Cari transaksi"><select class="search filter" id="cashFilter" aria-label="Filter jenis"><option value="">Semua jenis</option><option value="in">Pemasukan</option><option value="out">Pengeluaran</option></select></div><div id="cashRows">${table(['Tanggal','Keterangan','Jenis','Nominal','Aksi'],cashRows(),'Belum ada transaksi')}</div></section>`}
function arisanPage(){return `${pageHead('Arisan','Atur putaran, pantau pembayaran, dan catat penerima.',`<button class="btn btn-primary" onclick="openRound()">＋ Buat putaran</button>`)}<div class="stats">${statsCard('Jumlah putaran',data.rounds.length,'◉','Putaran terdaftar')}${statsCard('Total anggota',data.members.length,'♙','Peserta kelas')}${statsCard('Pembayaran tercatat',data.payments.length,'✓','Seluruh putaran')}</div><section class="panel"><div class="panel-head"><h2>Daftar putaran</h2><span class="pill">${data.rounds.length} putaran</span></div>${data.rounds.length?`<div class="section-grid">${data.rounds.slice().sort((a,b)=>b.number-a.number).map(r=>{let ps=data.payments.filter(p=>p.roundId===r.id).length;let pct=data.members.length?Math.round(ps/data.members.length*100):0;let w=data.winners.find(w=>w.roundId===r.id);return `<article class="panel" style="margin:0"><div class="panel-head"><span class="pill">PUTARAN ${r.number}</span>${w?badge('Penerima tercatat','ok'):badge('Berjalan','wait')}</div><div class="stat-value" style="font-size:25px">${money(r.amount)}</div><div class="muted small">Iuran per anggota · ${dateFmt(r.date)}</div><div class="progress-row"><span>${ps}/${data.members.length} sudah bayar</span><b>${pct}%</b></div><div class="progress"><span style="width:${pct}%"></span></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:17px"><button class="btn btn-primary btn-sm" onclick="openPayment('${r.id}')">Catat pembayaran</button><button class="btn btn-soft btn-sm" onclick="openWinner('${r.id}')">${w?'Lihat penerima':'Catat penerima'}</button></div>${w?`<p class="hint">Penerima: <b>${esc(personName(w.memberId))}</b></p>`:''}</article>`}).join('')}</div>`:empty('◉','Belum ada putaran arisan','Buat putaran pertama untuk mulai mencatat pembayaran anggota.',`<button class="btn btn-primary" onclick="openRound()">＋ Buat putaran</button>`)}</section><section class="panel"><div class="panel-head"><h2>Riwayat pembayaran</h2></div>${table(['Putaran','Anggota','Tanggal','Nominal','Aksi'],data.payments.slice().reverse().map(p=>`<tr><td>${esc('Putaran '+(round(p.roundId)?.number||'—'))}</td><td>${esc(personName(p.memberId))}</td><td>${dateFmt(p.date)}</td><td>${money(p.amount)}</td><td><button class="btn btn-danger btn-sm" onclick="removePayment('${p.id}')">Hapus</button></td></tr>`),'Belum ada pembayaran')}</section><section class="panel"><div class="panel-head"><h2>Riwayat penerima</h2></div>${table(['Putaran','Penerima','Nominal tercatat'],data.winners.slice().reverse().map(w=>`<tr><td>Putaran ${round(w.roundId)?.number||'—'}</td><td>${esc(personName(w.memberId))}</td><td>${money(w.amount)}</td></tr>`),'Belum ada penerima arisan')}</section>`}
function reportPage(){return `${pageHead('Laporan','Ringkasan keuangan kelas dan ekspor data.',`<button class="btn btn-primary" onclick="exportAll()">⇩ Ekspor laporan</button>`)}<section class="panel"><div class="panel-head"><h2>Ringkasan kas</h2><span class="pill">Semua periode</span></div><div class="stats" style="margin:0">${statsCard('Saldo akhir',money(balance()),'◈')}${statsCard('Total pemasukan',money(sum('in')),'↙')}${statsCard('Total pengeluaran',money(sum('out')),'↗')}</div></section><section class="panel"><div class="panel-head"><h2>Unduh data</h2></div><div class="section-grid"><div class="quick"><span class="quick-ico">▤</span><b>Transaksi kas</b><small>Semua pemasukan dan pengeluaran</small><button class="btn btn-outline btn-sm" style="margin-top:14px" onclick="exportCash()">Unduh CSV ↓</button></div><div class="quick"><span class="quick-ico">♙</span><b>Daftar anggota</b><small>Nama dan nomor absen anggota</small><button class="btn btn-outline btn-sm" style="margin-top:14px" onclick="exportMembers()">Unduh CSV ↓</button></div><div class="quick"><span class="quick-ico">◉</span><b>Pembayaran arisan</b><small>Catatan iuran per anggota dan putaran</small><button class="btn btn-outline btn-sm" style="margin-top:14px" onclick="exportPayments()">Unduh CSV ↓</button></div><div class="quick"><span class="quick-ico">🏆</span><b>Penerima arisan</b><small>Riwayat penerima tiap putaran</small><button class="btn btn-outline btn-sm" style="margin-top:14px" onclick="exportWinners()">Unduh CSV ↓</button></div></div></section><section class="panel"><div class="panel-head"><h2>Pengaturan data</h2></div><div class="field"><label>Nama kelas</label><input id="className" value="${esc(data.className)}" maxlength="70"></div><div class="form-actions"><button class="btn btn-primary" onclick="saveClass()">Simpan nama kelas</button></div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><b style="font-size:14px">Cadangan dan reset</b><p class="hint">Data tersimpan di browser perangkat ini. Ekspor cadangan secara berkala. Reset akan menghapus semua data lokal dan tidak dapat dibatalkan.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-outline" onclick="backup()">⇩ Cadangkan semua data</button><button class="btn btn-danger" onclick="resetData()">Hapus semua data</button></div></section>`}
function render(){ $('topClass').textContent='KasKita / '+(data.className||'Kelas');const views={dashboard,anggota:membersPage,kas:cashPage,arisan:arisanPage,laporan:reportPage};$('mainContent').innerHTML=views[page]();if(page==='anggota')$('memberSearch').addEventListener('input',filterMembers);if(page==='kas'){ $('cashSearch').addEventListener('input',filterCash);$('cashFilter').addEventListener('change',filterCash)}}
function filterMembers(){const q=$('memberSearch').value.toLowerCase();const rows=data.members.filter(m=>(m.name+' '+m.absen).toLowerCase().includes(q));$('memberRows').innerHTML=table(['No.','Nama anggota','Absen','Status','Aksi'],rows.map((m,i)=>`<tr><td>${i+1}</td><td><div class="person"><div class="person-avatar">${esc(m.name.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase())}</div><div><b>${esc(m.name)}</b></div></div></td><td>${esc(m.absen||'—')}</td><td>${badge('Aktif','ok')}</td><td><button class="btn btn-outline btn-sm" onclick="openMember('${m.id}')">Edit</button> <button class="btn btn-danger btn-sm" onclick="removeMember('${m.id}')">Hapus</button></td></tr>`),'Anggota tidak ditemukan')}
function filterCash(){const q=$('cashSearch').value.toLowerCase(),t=$('cashFilter').value;const rows=[...data.cash].filter(x=>(x.desc+' '+x.category).toLowerCase().includes(q)&&(!t||x.type===t)).sort((a,b)=>b.date.localeCompare(a.date));$('cashRows').innerHTML=table(['Tanggal','Keterangan','Jenis','Nominal','Aksi'],rows.map(x=>`<tr><td>${dateFmt(x.date)}</td><td><b>${esc(x.desc)}</b></td><td>${x.type==='in'?badge('Pemasukan','ok'):badge('Pengeluaran','bad')}</td><td class="amount ${x.type}">${x.type==='in'?'+':'−'}${money(x.amount)}</td><td><button class="btn btn-danger btn-sm" onclick="removeCash('${x.id}')">Hapus</button></td></tr>`),'Transaksi tidak ditemukan')}
function showModal(title,body){$('modalRoot').innerHTML=`<div class="modal-backdrop" id="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">${title}</h2><button class="close" aria-label="Tutup dialog" onclick="closeModal()">×</button></div>${body}</section></div>`;const back=$('backdrop');back.addEventListener('click',e=>{if(e.target===back)closeModal()});document.addEventListener('keydown',escModal);setTimeout(()=>back.querySelector('input,select,button')?.focus(),30)}
function escModal(e){if(e.key==='Escape')closeModal()}
function closeModal(){$('modalRoot').innerHTML='';document.removeEventListener('keydown',escModal)}
function openMember(id=''){const m=member(id);showModal(m?'Edit anggota':'Tambah anggota',`<form id="memberForm" class="form-grid"><div class="field full"><label for="mName">Nama lengkap *</label><input id="mName" required maxlength="90" value="${esc(m?.name||'')}" placeholder="Masukkan nama anggota"></div><div class="field full"><label for="mAbs">Nomor absen</label><input id="mAbs" type="number" min="1" value="${esc(m?.absen||'')}" placeholder="Contoh: 12"></div><div class="form-actions full"><button type="button" class="btn btn-outline" onclick="closeModal()">Batal</button><button class="btn btn-primary">Simpan anggota</button></div></form>`);$('memberForm').onsubmit=e=>{e.preventDefault();const name=$('mName').value.trim(),absen=$('mAbs').value;if(!name)return;if(absen&&data.members.some(x=>x.absen===absen&&x.id!==id)){notify('Nomor absen sudah dipakai.','error');return}if(m){m.name=name;m.absen=absen}else data.members.push({id:uid(),name,absen});if(persist()){closeModal();render();notify(m?'Data anggota diperbarui.':'Anggota berhasil ditambahkan.')}}}
function openCash(){showModal('Catat transaksi',`<form id="cashForm" class="form-grid"><div class="field full"><label for="cType">Jenis transaksi *</label><select id="cType"><option value="in">Pemasukan</option><option value="out">Pengeluaran</option></select></div><div class="field full"><label for="cDesc">Keterangan *</label><input id="cDesc" required maxlength="140" placeholder="Contoh: Iuran kas mingguan"></div><div class="field full"><label for="cAmount">Nominal (Rp) *</label><input id="cAmount" type="number" min="1" step="1" required placeholder="Masukkan nominal"></div><div class="field full"><label for="cDate">Tanggal *</label><input id="cDate" type="date" required value="${dateNow()}"></div><div class="form-actions full"><button type="button" class="btn btn-outline" onclick="closeModal()">Batal</button><button class="btn btn-primary">Simpan transaksi</button></div></form>`);$('cashForm').onsubmit=e=>{e.preventDefault();const amount=Number($('cAmount').value);if(!Number.isSafeInteger(amount)||amount<=0){notify('Nominal harus berupa angka positif yang valid.','error');return}const tx={id:uid(),type:$('cType').value,desc:$('cDesc').value.trim(),amount,date:$('cDate').value,category:''};if(!tx.desc||!tx.date){notify('Lengkapi semua kolom wajib.','error');return}data.cash.push(tx);if(persist()){closeModal();render();notify('Transaksi berhasil disimpan.')}}}
function openRound(){showModal('Buat putaran arisan',`<form id="roundForm" class="form-grid"><div class="field"><label for="rNum">Nomor putaran *</label><input id="rNum" type="number" min="1" required placeholder="Contoh: 1" value="${Math.max(1,...data.rounds.map(r=>r.number+1))}"></div><div class="field"><label for="rAmount">Iuran per anggota (Rp) *</label><input id="rAmount" type="number" min="1" required placeholder="Contoh: 20000"></div><div class="field full"><label for="rDate">Tanggal putaran *</label><input id="rDate" type="date" value="${dateNow()}" required></div><p class="hint full">Peserta dihitung dari daftar anggota yang terdaftar saat ini. Pastikan data anggota sudah benar.</p><div class="form-actions full"><button type="button" class="btn btn-outline" onclick="closeModal()">Batal</button><button class="btn btn-primary">Simpan putaran</button></div></form>`);$('roundForm').onsubmit=e=>{e.preventDefault();const number=Number($('rNum').value),amount=Number($('rAmount').value);if(data.rounds.some(r=>r.number===number)){notify('Nomor putaran sudah digunakan.','error');return}if(!Number.isSafeInteger(amount)||amount<=0){notify('Nominal iuran tidak valid.','error');return}data.rounds.push({id:uid(),number,amount,date:$('rDate').value});if(persist()){closeModal();render();notify('Putaran arisan dibuat.')}}}
function memberOptions(selected=''){return `<option value="">Pilih anggota</option>`+data.members.map(m=>`<option value="${m.id}" ${m.id===selected?'selected':''}>${esc(m.name)}${m.absen?' · Absen '+esc(m.absen):''}</option>`).join('')}
function roundOptions(selected=''){return `<option value="">Pilih putaran</option>`+data.rounds.map(r=>`<option value="${r.id}" ${r.id===selected?'selected':''}>Putaran ${r.number} · ${money(r.amount)}</option>`).join('')}
function openPayment(roundId=''){if(!data.members.length||!data.rounds.length){notify('Tambahkan anggota dan buat putaran terlebih dahulu.','error');return}showModal('Catat pembayaran arisan',`<form id="payForm" class="form-grid"><div class="field full"><label for="pRound">Putaran *</label><select id="pRound" required>${roundOptions(roundId)}</select></div><div class="field full"><label for="pMember">Anggota *</label><select id="pMember" required>${memberOptions()}</select></div><div class="field full"><label for="pDate">Tanggal pembayaran *</label><input id="pDate" type="date" value="${dateNow()}" required></div><div class="form-actions full"><button type="button" class="btn btn-outline" onclick="closeModal()">Batal</button><button class="btn btn-primary">Konfirmasi pembayaran</button></div></form>`);$('payForm').onsubmit=e=>{e.preventDefault();const rid=$('pRound').value,mid=$('pMember').value,r=round(rid);if(!r||!mid)return;if(data.payments.some(p=>p.roundId===rid&&p.memberId===mid)){notify('Anggota sudah tercatat membayar di putaran ini.','error');return}data.payments.push({id:uid(),roundId:rid,memberId:mid,amount:r.amount,date:$('pDate').value});if(persist()){closeModal();render();notify('Pembayaran berhasil dicatat.')}}}
function openWinner(roundId=''){if(!data.members.length||!data.rounds.length){notify('Tambahkan anggota dan buat putaran terlebih dahulu.','error');return}showModal('Catat penerima arisan',`<form id="winnerForm" class="form-grid"><div class="field full"><label for="wRound">Putaran *</label><select id="wRound" required>${roundOptions(roundId)}</select></div><div class="field full"><label for="wMember">Penerima *</label><select id="wMember" required>${memberOptions()}</select></div><div class="field full"><label for="wAmount">Nominal diterima (Rp) *</label><input id="wAmount" type="number" min="1" required placeholder="Masukkan nominal yang benar"></div><p class="hint full">Masukkan nominal penerimaan sesuai aturan arisan kelas, termasuk potongan jika ada.</p><div class="form-actions full"><button type="button" class="btn btn-outline" onclick="closeModal()">Batal</button><button class="btn btn-primary">Simpan penerima</button></div></form>`);$('winnerForm').onsubmit=e=>{e.preventDefault();const rid=$('wRound').value,mid=$('wMember').value,amount=Number($('wAmount').value);if(data.winners.some(w=>w.roundId===rid)){notify('Putaran ini sudah memiliki penerima.','error');return}if(!Number.isSafeInteger(amount)||amount<=0){notify('Nominal penerimaan tidak valid.','error');return}data.winners.push({id:uid(),roundId:rid,memberId:mid,amount,date:dateNow()});if(persist()){closeModal();render();notify('Penerima arisan berhasil dicatat.')}}}
function confirmAction(title,desc,action,label='Hapus'){showModal(title,`<p class="muted" style="line-height:1.65;font-size:14px">${desc}</p><div class="form-actions"><button class="btn btn-outline" onclick="closeModal()">Batal</button><button class="btn btn-danger" id="confirmBtn">${label}</button></div>`);$('confirmBtn').onclick=()=>{action();closeModal();render()}}
function removeCash(id){confirmAction('Hapus transaksi?','Transaksi ini akan dihapus dari riwayat dan saldo kas dihitung ulang.',()=>{data.cash=data.cash.filter(x=>x.id!==id);persist();notify('Transaksi dihapus.')})}
function removeMember(id){const related=data.payments.some(p=>p.memberId===id)||data.winners.some(w=>w.memberId===id);confirmAction('Hapus anggota?',related?'Anggota ini memiliki riwayat arisan. Nama pada riwayat akan tetap tersimpan sebagai anggota dihapus.':'Anggota akan dihapus dari daftar kelas.',()=>{data.members=data.members.filter(x=>x.id!==id);persist();notify('Anggota dihapus.')})}
function removePayment(id){confirmAction('Hapus catatan pembayaran?','Status pembayaran anggota pada putaran ini akan berubah.',()=>{data.payments=data.payments.filter(p=>p.id!==id);persist();notify('Catatan pembayaran dihapus.')})}
function saveClass(){const n=$('className').value.trim();if(!n){notify('Nama kelas tidak boleh kosong.','error');return}data.className=n;persist();render();notify('Nama kelas diperbarui.')}
function csv(name,rows){const content=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');const blob=new Blob(['\ufeff'+content],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('File CSV disiapkan.')}
function exportCash(){csv('kaskita-transaksi-kas',[['Tanggal','Jenis','Keterangan','Nominal'],...data.cash.map(x=>[x.date,x.type==='in'?'Pemasukan':'Pengeluaran',x.desc,x.amount])])}
function exportMembers(){csv('kaskita-anggota',[['Nama','Nomor absen'],...data.members.map(m=>[m.name,m.absen])])}
function exportPayments(){csv('kaskita-pembayaran-arisan',[['Putaran','Anggota','Tanggal','Nominal'],...data.payments.map(p=>[round(p.roundId)?.number,personName(p.memberId),p.date,p.amount])])}
function exportWinners(){csv('kaskita-penerima-arisan',[['Putaran','Penerima','Nominal','Tanggal'],...data.winners.map(w=>[round(w.roundId)?.number,personName(w.memberId),w.amount,w.date])])}
function exportAll(){exportCash();setTimeout(exportMembers,250);setTimeout(exportPayments,500);setTimeout(exportWinners,750)}
function backup(){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=url;a.download='kaskita-cadangan-'+dateNow()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Cadangan data berhasil disiapkan.')}
function resetData(){confirmAction('Hapus semua data?','Seluruh anggota, transaksi, putaran, pembayaran, dan penerima akan dihapus permanen dari browser ini.',()=>{data={...init,members:[],cash:[],rounds:[],payments:[],winners:[]};persist();notify('Semua data telah dihapus.')},'Hapus semua')}
render();
</script>
</body>
</html>
